<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Scouting</title>
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        #ScoutingForm {
            width: 80%;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #555;
        }

        input[type="text"], input[type="number"], input[type="range"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 200px;
            margin: 10px auto;
        }

        .counter button {
            padding: 8px 12px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .counter button:hover {
            background-color: #45a049;
        }

        .counter input {
            width: 50px;
            text-align: center;
            padding: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .range-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .range-container input[type="range"] {
            width: 80%;
        }

        .range-container output {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }

        button.submit {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button.submit:hover {
            background-color: #45a049;
        }

    </style>
</head>

<body>
    <div id="ScoutingForm">
        <h1>JSON Scouting Form</h1>
        <h2>Enter the details for scouting</h2>

        <label for="scoutingName">Scouting Name:</label>
        <input type="text" id="scoutingName" name="scoutingName" placeholder="Enter Scouting Name" required>

        <label for="counter">Select Counter Value:</label>
        <div class="counter">
            <button type="button" onclick="decreaseCounter()">-</button>
            <input type="number" id="counter" value="0" readonly>
            <button type="button" onclick="increaseCounter()">+</button>
        </div>

        <label for="scoutingRange">Select Range:</label>
        <div class="range-container">
            <input type="range" id="scoutingRange" min="0" max="100" value="50">
            <output for="scoutingRange" id="rangeValue">50</output>
        </div>

        <button class="submit" type="submit">Submit Form</button>
    </div>

    <script>
        function decreaseCounter() {
            var counter = document.getElementById('counter');
            if (counter.value > 0) {
                counter.value = parseInt(counter.value) - 1;
            }
        }

        function increaseCounter() {
            var counter = document.getElementById('counter');
            counter.value = parseInt(counter.value) + 1;
        }

        const rangeInput = document.getElementById('scoutingRange');
        const rangeOutput = document.getElementById('rangeValue');
        rangeInput.addEventListener('input', function() {
            rangeOutput.textContent = rangeInput.value;
        });
    </script>
</body>
